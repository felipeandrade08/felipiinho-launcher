name: Ajustar Manutenções sem Filiais

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar manutenção sem filiais
        shell: python
        run: |
          from pathlib import Path
          import re

          html_path = Path('frontend/public/manutencoes.html')
          js_path = Path('frontend/public/js/pages/manutencoes.js')
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          # Remove a decisão de penalidade do modal de regularização.
          decision = '''        <div class="mb-3">
          <label class="form-label-gr">Decisão</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="decisaoRegularizar" id="optPenalizar" value="penalizar" checked>
              <label class="form-check-label" for="optPenalizar" style="color:var(--perigo);font-weight:600;">
                <i class="fa-solid fa-gavel"></i> Penalizar motorista
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="decisaoRegularizar" id="optLiberar" value="liberar">
              <label class="form-check-label" for="optLiberar" style="color:var(--sucesso);font-weight:600;">
                <i class="fa-solid fa-check"></i> Liberar como correto
              </label>
            </div>
          </div>
        </div>
'''
          html = html.replace(decision, '')
          html = html.replace('<i class="fa-solid fa-gavel"></i> Confirmar decisão', '<i class="fa-solid fa-check"></i> Confirmar regularização')
          html = html.replace('colspan="9"', 'colspan="8"')
          html_path.write_text(html, encoding='utf-8')

          # Regularização sempre sem penalidade.
          js = js.replace("  document.getElementById('optPenalizar').checked = true;\n", '')
          js = js.replace("  const decisao  = document.querySelector('input[name=\"decisaoRegularizar\"]:checked').value;\n  const penalizar = decisao === 'penalizar';\n", '')
          js = js.replace("await ApiService.patch(`/manutencoes/${id}/regularizar`, { penalizar, observacoes: obs });", "await ApiService.patch(`/manutencoes/${id}/regularizar`, { penalizar: false, observacoes: obs });")
          js = js.replace("    Swal.fire({\n      icon: penalizar ? 'warning' : 'success',\n      title: penalizar ? 'Penalidade aplicada' : 'Liberado sem penalidade',\n      timer: 2500, showConfirmButton: false,\n    });", "    Swal.fire({ icon: 'success', title: 'Manutenção regularizada', timer: 2500, showConfirmButton: false });")
          js = js.replace('colspan="9"', 'colspan="8"')
          js_path.write_text(js, encoding='utf-8')

          # Não permitir que a limpeza reintroduza a antiga dependência.
          for path in (html_path, js_path):
              text = path.read_text(encoding='utf-8').lower()
              forbidden = ['filiais-credenciadas', 'badgefilialmodal', 'filiaiscredenciadas', 'penalidade no ranking']
              found = [x for x in forbidden if x in text]
              if found:
                  raise SystemExit(f'Referências proibidas encontradas em {path}: {found}')

      - name: Commit alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/manutencoes.html frontend/public/js/pages/manutencoes.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: manutencoes sem penalidade por filial"
          git push
