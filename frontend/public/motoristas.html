<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motoristas | FELIPINHO LAUNCHER</title>
<link rel="icon" type="image/png" href="img/logo/favicon.png" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/design-system.css" rel="stylesheet">
<link href="css/motoristas-page.css" rel="stylesheet">
</head>
<body>
<div id="appShell" class="app-shell">
  <main id="conteudoPagina">
    <section class="motoristas-hero" data-aos="fade-up">
      <div><span class="motoristas-hero__eyebrow"><i class="fa-solid fa-id-card"></i> GESTÃO DE EQUIPE</span><h1>Motoristas</h1><p>Acompanhe sua equipe, desempenho e situação operacional.</p></div>
      <button class="btn-gr-primario motoristas-hero__btn" id="btnNovoMotorista"><i class="fa-solid fa-user-plus"></i> Novo Motorista</button>
    </section>
    <section class="motoristas-toolbar" data-aos="fade-up" data-aos-delay="50">
      <div class="motoristas-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="campoBusca" placeholder="Buscar por nome, apelido ou CNH..."></div>
      <select class="form-select motoristas-status" id="filtroStatus"><option value="">Todos os status</option><option value="ativo">Ativo</option><option value="ferias">Férias</option><option value="suspenso">Suspenso</option><option value="inativo">Inativo</option></select>
      <div class="motoristas-count"><i class="fa-solid fa-users"></i><span id="contadorMotoristas">Equipe</span></div>
    </section>
    <div class="card-gr motoristas-table-card" data-aos="fade-up" data-aos-delay="90">
      <div class="motoristas-table-head"><div><span>CADASTRO E DESEMPENHO</span><h2>Equipe de motoristas</h2></div><small>Dados sincronizados com a operação</small></div>
      <div class="table-responsive"><table class="tabela-gr motoristas-table"><thead><tr><th>Motorista</th><th>CNH</th><th>Contato</th><th>Viagens</th><th>KM total</th><th>Faturado</th><th>Status</th><th></th></tr></thead><tbody id="corpoTabelaMotoristas"><tr><td colspan="8" class="text-center text-muted py-5"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Carregando equipe...</td></tr></tbody></table></div>
    </div>
  </main>
</div>
<div class="modal fade" id="modalMotorista" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content motoristas-modal"><div class="modal-header"><div><span class="modal-kicker">GESTÃO DE MOTORISTA</span><h5 class="modal-title fonte-display fw-bold" id="tituloModalMotorista">Novo Motorista</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="formMotorista"><div class="modal-body"><input type="hidden" id="motoristaId"><div class="row g-3"><div class="col-md-7"><label class="form-label-gr">Nome completo *</label><input type="text" class="form-control" id="campoNome" required></div><div class="col-md-5"><label class="form-label-gr">Apelido (gamertag)</label><input type="text" class="form-control" id="campoApelido"></div><div class="col-md-4"><label class="form-label-gr">CNH</label><input type="text" class="form-control" id="campoCnh"></div><div class="col-md-4"><label class="form-label-gr">Telefone</label><input type="text" class="form-control" id="campoTelefone"></div><div class="col-md-4"><label class="form-label-gr">E-mail</label><input type="email" class="form-control" id="campoEmail"></div><div class="col-md-6"><label class="form-label-gr">Steam ID</label><input type="text" class="form-control" id="campoSteamId"></div><div class="col-md-6"><label class="form-label-gr">Data de admissão</label><input type="date" class="form-control" id="campoDataAdmissao"></div><div class="col-md-6"><label class="form-label-gr">Status</label><select class="form-select" id="campoStatus"><option value="ativo">Ativo</option><option value="ferias">Férias</option><option value="suspenso">Suspenso</option><option value="inativo">Inativo</option></select></div><div class="col-12"><label class="form-label-gr">Observações</label><textarea class="form-control" id="campoObservacoes" rows="2"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-gr-primario"><i class="fa-solid fa-floppy-disk"></i> Salvar motorista</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/motoristas.js"></script>
</body></html>
