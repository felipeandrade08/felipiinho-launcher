<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Notas Fiscais | FELIPINHO LAUNCHER</title><link rel="icon" type="image/png" href="img/logo/favicon.png"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet"><link href="css/design-system.css" rel="stylesheet"><link href="css/notas-fiscais-page.css" rel="stylesheet"></head><body><div id="appShell" class="app-shell"><main id="conteudoPagina"><section class="nf-hero" data-aos="fade-up"><div><span><i class="fa-solid fa-file-invoice"></i> DOCUMENTAÇÃO FISCAL</span><h1>Notas Fiscais</h1><p>Consulte, emita e acompanhe os documentos fiscais das viagens.</p></div><div class="nf-badge"><i class="fa-solid fa-shield-halved"></i> Gestão fiscal</div></section><section class="nf-toolbar" data-aos="fade-up"><div class="nf-filters"><div class="nf-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="campoBusca" placeholder="Buscar por cliente ou número..."></div><select id="filtroStatus" class="form-select"><option value="">Todos os status</option><option value="emitida">Emitida</option><option value="paga">Paga</option><option value="pendente">Pendente</option><option value="cancelada">Cancelada</option></select></div><button class="btn-gr-primario" id="btnNovaNota"><i class="fa-solid fa-plus"></i> Emitir Nota Fiscal</button></section><section class="card-gr nf-table-card" data-aos="fade-up"><div class="nf-table-title"><div><span>DOCUMENTOS</span><h2>Notas fiscais cadastradas</h2></div><i class="fa-solid fa-receipt"></i></div><div class="table-responsive"><table class="tabela-gr"><thead><tr><th>Número</th><th>Cliente</th><th>Viagem</th><th>Valor</th><th>Emissão</th><th>Status</th><th></th></tr></thead><tbody id="corpoTabelaNotas"><tr><td colspan="7" class="text-center text-muted py-4">Carregando...</td></tr></tbody></table></div></section></main></div><div class="modal fade" id="modalVisualizarNota" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content nf-modal"><div class="modal-header"><h5 class="modal-title fonte-display fw-bold"><i class="fa-solid fa-file-invoice me-2"></i>Nota Fiscal</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body nf-modal-body"><div id="documentoNotaFiscal"></div></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Fechar</button><button type="button" class="btn-gr-primario" id="btnImprimirNota"><i class="fa-solid fa-print"></i> Imprimir / Salvar PDF</button></div></div></div></div><div class="modal fade" id="modalNota" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content nf-modal"><div class="modal-header"><h5 class="modal-title fonte-display fw-bold" id="tituloModalNota">Emitir Nota Fiscal</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="formNota"><div class="modal-body"><input type="hidden" id="notaId"><div class="row g-3"><div class="col-md-7"><label class="form-label-gr">Cliente *</label><input type="text" class="form-control" id="campoCliente" required></div><div class="col-md-5"><label class="form-label-gr">CNPJ/CPF</label><input type="text" class="form-control" id="campoCnpjCpf"></div><div class="col-md-6"><label class="form-label-gr">Viagem vinculada</label><select class="form-select" id="campoViagemId"><option value="">Nenhuma</option></select></div><div class="col-md-6"><label class="form-label-gr">Descrição da carga</label><input type="text" class="form-control" id="campoDescricaoCarga"></div><div class="col-md-4"><label class="form-label-gr">Valor total (R$) *</label><input type="number" step="0.01" class="form-control" id="campoValorTotal" required></div><div class="col-md-4"><label class="form-label-gr">Data de emissão *</label><input type="date" class="form-control" id="campoDataEmissao" required></div><div class="col-md-4"><label class="form-label-gr">Status</label><select class="form-select" id="campoStatus"><option value="pendente">Pendente</option><option value="emitida">Emitida</option><option value="paga">Paga</option><option value="cancelada">Cancelada</option></select></div><div class="col-12"><label class="form-label-gr">Observações</label><textarea class="form-control" id="campoObservacoes" rows="2"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-gr-primario"><i class="fa-solid fa-check"></i> Salvar Nota</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/notas-fiscais.js"></script></body></html>
