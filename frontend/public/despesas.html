<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Despesas | FELIPINHO LAUNCHER</title><link rel="icon" type="image/png" href="img/logo/favicon.png"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet"><link href="css/design-system.css" rel="stylesheet"><link href="css/despesas-page.css" rel="stylesheet"></head><body><div id="appShell" class="app-shell"><main id="conteudoPagina"><section class="desp-hero" data-aos="fade-up"><div><span><i class="fa-solid fa-file-invoice-dollar"></i> CONTROLE DE SAÍDAS</span><h1>Despesas</h1><p>Organize custos, vínculos e pagamentos da operação.</p></div><button class="btn-gr-primario" id="btnNovaDespesa"><i class="fa-solid fa-plus"></i> Nova Despesa</button></section><div class="row g-3 mb-4"><div class="col-lg-7" data-aos="fade-up"><div class="card-gr desp-chart"><div class="card-gr__header"><h3><i class="fa-solid fa-chart-pie me-2"></i>Despesas por categoria</h3><span>Distribuição dos custos</span></div><div class="card-gr__body"><canvas id="graficoCategorias" height="220"></canvas></div></div></div><div class="col-lg-5" data-aos="fade-up" data-aos-delay="50"><div class="row g-3 h-100"><div class="col-12" id="cardTotalDespesas"></div><div class="col-12" id="cardQtdDespesas"></div></div></div></div><section class="desp-toolbar" data-aos="fade-up"><div class="desp-filters"><div class="filter-wrap"><i class="fa-solid fa-layer-group"></i><select class="form-select" id="filtroCategoria"><option value="">Todas as categorias</option><option value="manutencao">Manutenção</option><option value="pneus">Pneus</option><option value="multa">Multa</option><option value="pedagio">Pedágio</option><option value="seguro">Seguro</option><option value="salario">Salário</option><option value="administrativa">Administrativa</option><option value="outra">Outra</option></select></div><input type="date" class="form-control" id="filtroDataInicio"><input type="date" class="form-control" id="filtroDataFim"></div><span class="desp-history"><i class="fa-solid fa-receipt"></i> Histórico de despesas</span></section><div class="card-gr desp-table" data-aos="fade-up"><div class="desp-table-head"><div><span>LANÇAMENTOS</span><h2>Histórico de despesas</h2></div></div><div class="table-responsive"><table class="tabela-gr"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Vínculo</th><th>Valor</th><th>Pagamento</th><th></th></tr></thead><tbody id="corpoTabelaDespesas"><tr><td colspan="7" class="text-center text-muted py-5"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Carregando despesas...</td></tr></tbody></table></div></div></main></div><div class="modal fade" id="modalDespesa" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content desp-modal"><div class="modal-header"><div><span class="modal-kicker">LANÇAMENTO DE DESPESA</span><h5 class="modal-title fonte-display fw-bold" id="tituloModalDespesa">Nova Despesa</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="formDespesa"><div class="modal-body"><input type="hidden" id="despesaId"><div class="row g-3"><div class="col-md-6"><label class="form-label-gr">Descrição *</label><input type="text" class="form-control" id="campoDescricao" required></div><div class="col-md-6"><label class="form-label-gr">Categoria *</label><select class="form-select" id="campoCategoria" required><option value="manutencao">Manutenção</option><option value="pneus">Pneus</option><option value="multa">Multa</option><option value="pedagio">Pedágio</option><option value="seguro">Seguro</option><option value="salario">Salário</option><option value="administrativa">Administrativa</option><option value="outra">Outra</option></select></div><div class="col-md-4"><label class="form-label-gr">Caminhão</label><select class="form-select" id="campoCaminhaoId"><option value="">Não vinculado</option></select></div><div class="col-md-4"><label class="form-label-gr">Reboque</label><select class="form-select" id="campoReboqueId"><option value="">Não vinculado</option></select></div><div class="col-md-4"><label class="form-label-gr">Motorista</label><select class="form-select" id="campoMotoristaId"><option value="">Não vinculado</option></select></div><div class="col-md-4"><label class="form-label-gr">Valor (R$) *</label><input type="number" step="0.01" class="form-control" id="campoValor" required></div><div class="col-md-4"><label class="form-label-gr">Data *</label><input type="date" class="form-control" id="campoDataDespesa" required></div><div class="col-md-4"><label class="form-label-gr">Forma de pagamento</label><select class="form-select" id="campoFormaPagamento"><option value="dinheiro">Dinheiro</option><option value="transferencia">Transferência</option><option value="cartao">Cartão</option><option value="outro">Outro</option></select></div><div class="col-12"><label class="form-label-gr">Observações</label><textarea class="form-control" id="campoObservacoes" rows="2"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-gr-primario"><i class="fa-solid fa-floppy-disk"></i> Salvar despesa</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/despesas.js"></script></body></html>
