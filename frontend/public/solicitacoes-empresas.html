<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Solicitações de Empresas | FELIPINHO LAUNCHER</title><link rel="icon" type="image/png" href="img/logo/favicon.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="css/design-system.css" rel="stylesheet"><link href="css/realistic-ui.css" rel="stylesheet"><link href="css/realistic-dashboard.css" rel="stylesheet"><style>.sol-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.sol-kicker{font-size:.62rem;font-weight:900;letter-spacing:.16em;color:#9a7a2e}.sol-hero h1{font-size:1.55rem;font-weight:850;color:#17201b;margin:6px 0}.sol-hero p{margin:0;color:#7d8782;font-size:.75rem}.sol-count{padding:11px 15px;border-radius:12px;background:#fff;border:1px solid #edf0ee;font-weight:800;color:#27312c;box-shadow:0 8px 25px rgba(22,31,26,.05)}.sol-card{background:#fff;border:1px solid rgba(17,25,21,.07);border-radius:18px;box-shadow:0 12px 35px rgba(22,31,26,.07);overflow:hidden}.sol-table{width:100%;border-collapse:collapse;font-size:.78rem}.sol-table th{padding:13px 15px;background:#f7f9f8;color:#89918d;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;text-align:left}.sol-table td{padding:16px 15px;border-top:1px solid #eef1ef;vertical-align:middle;color:#303a34}.sol-name{font-weight:850;color:#202923}.sol-meta{font-size:.66rem;color:#929b96;margin-top:4px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:#fff7e5;color:#9a700c;font-size:.61rem;font-weight:850}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn-sol{border:0;border-radius:9px;padding:8px 11px;font-size:.68rem;font-weight:800;cursor:pointer}.btn-ok{background:#17201b;color:#fff}.btn-no{background:#fff0f0;color:#c43e3e;border:1px solid #ffd7d7}.btn-view{background:#f2f5f3;color:#435049}.empty{text-align:center;padding:55px 20px;color:#89918d}.empty i{font-size:2rem;color:#43a765;margin-bottom:12px}.detail{line-height:1.7;font-size:.82rem;color:#4c5751}.detail b{color:#202923}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.sol-hero{align-items:flex-start;flex-direction:column}.sol-table{min-width:760px}.sol-card{overflow-x:auto}}</style></head><body><div id="appShell" class="app-shell"><main id="conteudoPagina"><div class="text-center py-5">Carregando...</div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/menu-empresas.js"></script><script>let solicitacoes=[];(async()=>{if(!AuthService.ehAdmin()){location.href='dashboard.html';return}montarLayout({paginaAtiva:'solicitacoes-empresas',titulo:'Solicitações de Empresas',subtitulo:'Analise e aprove novas transportadoras do ecossistema'});await carregar()})();async function carregar(){const area=document.getElementById('conteudoPagina');area.innerHTML='<div class="text-center py-5"><i class="fa-solid fa-spinner spin"></i> Carregando solicitações...</div>';try{solicitacoes=await ApiService.get('/empresas/solicitacoes');render()}catch(e){area.innerHTML=`<div class="sol-card empty"><i class="fa-solid fa-triangle-exclamation"></i><h4>Não foi possível carregar</h4><p>${e.message}</p></div>`}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const area=document.getElementById('conteudoPagina');area.innerHTML=`<div class="sol-hero"><div><div class="sol-kicker"><i class="fa-solid fa-building-circle-check"></i> CONTROLE DE EMPRESAS</div><h1>Solicitações de Empresas</h1><p>Revise os dados antes de liberar uma nova transportadora.</p></div><div class="sol-count"><i class="fa-solid fa-clock"></i> ${solicitacoes.length} pendente(s)</div></div><section class="sol-card">${solicitacoes.length?`<table class="sol-table"><thead><tr><th>Empresa</th><th>Responsável</th><th>Contato</th><th>Localização</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${solicitacoes.map(s=>`<tr><td><div class="sol-name">${esc(s.nome)}</div><div class="sol-meta">${esc(s.slug)}</div></td><td><div class="sol-name">${esc(s.responsavel)}</div><div class="sol-meta">Solicitante: ${esc(s.solicitante_nome)}</div></td><td>${esc(s.email)}</td><td>${esc(s.localizacao||'Não informado')}</td><td>${s.criado_em?new Date(s.criado_em).toLocaleDateString('pt-BR'):'—'}</td><td><span class="pill"><i class="fa-solid fa-hourglass-half"></i> Pendente</span></td><td><div class="actions"><button class="btn-sol btn-view" onclick="ver(${s.id})"><i class="fa-solid fa-eye"></i></button><button class="btn-sol btn-ok" onclick="aprovar(${s.id})"><i class="fa-solid fa-check"></i> Aprovar</button><button class="btn-sol btn-no" onclick="rejeitar(${s.id})"><i class="fa-solid fa-xmark"></i> Recusar</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><i class="fa-solid fa-circle-check"></i><h4>Nenhuma solicitação pendente</h4><p>Todas as empresas foram analisadas.</p></div>`}</section>`}function obter(id){return solicitacoes.find(s=>Number(s.id)===Number(id))}function ver(id){const s=obter(id);if(!s)return;Swal.fire({title:s.nome,html:`<div class="detail" style="text-align:left"><b>Responsável:</b> ${esc(s.responsavel)}<br><b>Solicitante:</b> ${esc(s.solicitante_nome)}<br><b>E-mail:</b> ${esc(s.email)}<br><b>Localização:</b> ${esc(s.localizacao||'Não informado')}<br><b>Discord:</b> ${esc(s.discord||'Não informado')}<br><b>Instagram:</b> ${esc(s.instagram||'Não informado')}<br><b>Site:</b> ${esc(s.site||'Não informado')}<br><br><b>Descrição:</b><br>${esc(s.descricao||'Não informada')}</div>`,confirmButtonText:'Fechar',width:650})}async function aprovar(id){const s=obter(id);const r=await Swal.fire({title:'Aprovar empresa?',html:`A empresa <b>${esc(s.nome)}</b> será criada e o solicitante será definido como proprietário.`,icon:'question',showCancelButton:true,confirmButtonText:'Sim, aprovar',cancelButtonText:'Cancelar',confirmButtonColor:'#17201b'});if(!r.isConfirmed)return;try{await ApiService.patch(`/empresas/solicitacoes/${id}/aprovar`,{});await Swal.fire({icon:'success',title:'Empresa aprovada!',text:'A empresa e a conta empresarial foram criadas.',confirmButtonText:'Continuar'});await carregar()}catch(e){Swal.fire({icon:'error',title:'Erro',text:e.message})}}async function rejeitar(id){const s=obter(id);const r=await Swal.fire({title:'Recusar empresa?',input:'textarea',inputLabel:'Motivo da recusa (opcional)',inputPlaceholder:'Explique o motivo...',showCancelButton:true,confirmButtonText:'Recusar',cancelButtonText:'Cancelar',confirmButtonColor:'#c43e3e'});if(!r.isConfirmed)return;try{await ApiService.patch(`/empresas/solicitacoes/${id}/rejeitar`,{motivo:r.value||''});await carregar()}catch(e){Swal.fire({icon:'error',title:'Erro',text:e.message})}}</script></body></html>
