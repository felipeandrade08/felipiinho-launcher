<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Pendentes | FELIPINHO LAUNCHER</title><link rel="icon" type="image/png" href="img/logo/favicon.png"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet"><link href="css/design-system.css" rel="stylesheet"><link href="css/pendentes-page.css" rel="stylesheet"></head><body><div id="appShell" class="app-shell"><main id="conteudoPagina"><section class="pend-hero" data-aos="fade-up"><div><span><i class="fa-solid fa-hourglass-half"></i> CENTRAL DE PENDÊNCIAS</span><h1>Pendentes</h1><p>Revise abastecimentos e manutenções que aguardam regularização.</p></div><div class="pend-state"><i class="fa-solid fa-shield-halved"></i> Revisão operacional</div></section><section class="row g-3 mb-4" id="kpisPendentes" data-aos="fade-up"></section><section class="pend-tabs" data-aos="fade-up"><button class="pend-tab ativo" onclick="filtrar('todos',this)">Todos <b id="badgeTodos"></b></button><button class="pend-tab" onclick="filtrar('abastecimento',this)"><i class="fa-solid fa-gas-pump"></i> Abastecimentos <b id="badgeAbast"></b></button><button class="pend-tab" onclick="filtrar('manutencao',this)"><i class="fa-solid fa-screwdriver-wrench"></i> Manutenções <b id="badgeManut"></b></button></section><section id="listaPendentes" class="pend-list" data-aos="fade-up"><div class="empty-pendentes"><i class="fa-solid fa-hourglass"></i>Carregando...</div></section></main></div><div class="modal fade" id="modalRegularizarPend" tabindex="-1"><div class="modal-dialog"><div class="modal-content pend-modal"><div class="modal-header"><div><span class="pend-kicker">REGULARIZAÇÃO</span><h5 class="modal-title fonte-display fw-bold" id="tituloModalPend">Regularizar</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="infoModalPend" class="pend-info mb-3"></div><input type="hidden" id="pendId"><input type="hidden" id="pendTipo"><div class="mb-3"><label class="form-label-gr">Decisão</label><div class="pend-decisoes"><label><input type="radio" name="decisaoPend" id="optPendAprovar" value="aprovar" checked><span><i class="fa-solid fa-check"></i> Aprovar <small>sem penalidade</small></span></label><label><input type="radio" name="decisaoPend" id="optPendPenalizar" value="penalizar"><span><i class="fa-solid fa-gavel"></i> Penalizar <small>motorista</small></span></label></div></div><label class="form-label-gr">Observação <small>(opcional)</small></label><textarea class="form-control" id="pendObs" rows="2" placeholder="Motivo da decisão..."></textarea></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn-gr-primario" id="btnConfirmarPend"><i class="fa-solid fa-check-double"></i> Confirmar</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/pendentes.js"></script></body></html>
