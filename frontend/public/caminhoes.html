<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frota | FELIPINHO LAUNCHER</title><link rel="icon" type="image/png" href="img/logo/favicon.png" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet"><link href="css/design-system.css" rel="stylesheet"><link href="css/caminhoes-page.css" rel="stylesheet">
</head><body><div id="appShell" class="app-shell"><main id="conteudoPagina">
<section class="frota-hero" data-aos="fade-up"><div><span><i class="fa-solid fa-truck-front"></i> GESTÃO DA FROTA</span><h1>Caminhões</h1><p>Controle veículos, disponibilidade e informações operacionais.</p></div><button class="btn-gr-primario" id="btnNovoCaminhao"><i class="fa-solid fa-plus"></i> Novo Caminhão</button></section>
<section class="frota-toolbar" data-aos="fade-up" data-aos-delay="50"><div class="frota-search"><i class="fa-solid fa-magnifying-glass"></i><input id="campoBusca" placeholder="Buscar placa, marca ou modelo..."></div><select class="form-select" id="filtroStatus"><option value="">Todos os status</option><option value="disponivel">Disponível</option><option value="em_viagem">Em viagem</option><option value="manutencao">Manutenção</option><option value="inativo">Inativo</option></select><div class="frota-count"><i class="fa-solid fa-truck"></i><span>Frota</span></div></section>
<div class="row g-3" id="gridCaminhoes" data-aos="fade-up" data-aos-delay="90"><div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Carregando frota...</div></div>
</main></div>
<div class="modal fade" id="modalCaminhao" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content frota-modal"><div class="modal-header"><div><span class="modal-kicker">CADASTRO DE VEÍCULO</span><h5 class="modal-title fonte-display fw-bold" id="tituloModalCaminhao">Novo Caminhão</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="formCaminhao"><div class="modal-body"><input type="hidden" id="caminhaoId"><div class="row g-3"><div class="col-md-4"><label class="form-label-gr">Placa *</label><input class="form-control text-uppercase" id="campoPlaca" required></div><div class="col-md-4"><label class="form-label-gr">Marca *</label><input class="form-control" id="campoMarca" required></div><div class="col-md-4"><label class="form-label-gr">Modelo *</label><input class="form-control" id="campoModelo" required></div><div class="col-md-3"><label class="form-label-gr">Ano</label><input type="number" class="form-control" id="campoAno"></div><div class="col-md-3"><label class="form-label-gr">Cor</label><input class="form-control" id="campoCor"></div><div class="col-md-3"><label class="form-label-gr">KM atual</label><input type="number" step="0.01" class="form-control" id="campoKmAtual"></div><div class="col-md-3"><label class="form-label-gr">Status</label><select class="form-select" id="campoStatus"><option value="disponivel">Disponível</option><option value="em_viagem">Em viagem</option><option value="manutencao">Manutenção</option><option value="inativo">Inativo</option></select></div><div class="col-md-4"><label class="form-label-gr">Tanque (L)</label><input type="number" step="0.01" class="form-control" id="campoCapacidadeTanque"></div><div class="col-md-4"><label class="form-label-gr">Consumo (km/L)</label><input type="number" step="0.01" class="form-control" id="campoConsumoMedio"></div><div class="col-md-4"><label class="form-label-gr">Valor de aquisição</label><input type="number" step="0.01" class="form-control" id="campoValorAquisicao"></div><div class="col-12"><label class="form-label-gr">Motorista responsável</label><select class="form-select" id="campoMotoristaId"><option value="">Nenhum / Não atribuído</option></select></div><div class="col-12"><label class="form-label-gr">Observações</label><textarea class="form-control" id="campoObservacoes" rows="2"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn-gr-outline" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-gr-primario"><i class="fa-solid fa-floppy-disk"></i> Salvar</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/caminhoes.js"></script></body></html>
