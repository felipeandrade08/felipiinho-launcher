<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central de Operações | FELIPINHO LAUNCHER</title>
<link rel="icon" type="image/png" href="img/logo/favicon.png" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/design-system.css" rel="stylesheet">
<link href="css/realistic-ui.css" rel="stylesheet">
<link href="css/realistic-dashboard.css" rel="stylesheet">
<style>
.central-op-card{background:linear-gradient(135deg,#151b18,#222c27);color:#fff;border-radius:20px;padding:22px;box-shadow:0 18px 45px rgba(16,24,20,.14);overflow:hidden}.central-op-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.central-op-kicker{font-size:.62rem;font-weight:900;letter-spacing:.16em;color:#d4a017}.central-op-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#48b86b;box-shadow:0 0 0 5px rgba(72,184,107,.12);margin-right:7px}.central-op-top h2{font-size:1.25rem;margin:7px 0 3px;font-weight:850}.central-op-top p{margin:0;color:#9fa9a4;font-size:.75rem}.central-op-clock{font:800 1rem/1 monospace;color:#e9eee9;background:rgba(255,255,255,.06);padding:11px 13px;border-radius:11px}.central-op-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.central-op-stat{display:flex;align-items:center;gap:11px;padding:14px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06)}.central-op-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(212,160,23,.13);color:#d4a017}.central-op-icon.alerta{color:#ffbd4a;background:rgba(255,189,74,.1)}.central-op-stat strong{display:block;font-size:1.15rem;line-height:1}.central-op-stat small{display:block;color:#929d97;font-size:.58rem;font-weight:800;letter-spacing:.07em;margin-top:5px}.central-op-footer{display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.07);margin-top:18px;padding-top:14px;color:#89958f;font-size:.65rem}.central-op-footer i{margin-right:5px}.central-op-footer b{color:#5cc579;margin-left:3px}@media(max-width:768px){.central-op-card{padding:17px}.central-op-top{align-items:flex-start}.central-op-clock{font-size:.75rem}.central-op-stats{grid-template-columns:repeat(2,1fr)}.central-op-footer{gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div id="appShell" class="app-shell"><main id="conteudoPagina"><div class="text-center text-muted py-5">Carregando central de operações...</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/config.js"></script><script src="js/services/api.js"></script><script src="js/services/auth.js"></script><script src="js/utils/formatadores.js"></script><script src="js/utils/layout.js"></script><script src="js/pages/dashboard.js"></script><script src="js/pages/central-operacoes.js"></script>
</body></html>
